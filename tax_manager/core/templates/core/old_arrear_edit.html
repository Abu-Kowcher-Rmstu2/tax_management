<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>পুরাতন বকেয়া এডিট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">
    <div class="max-w-2xl w-full mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="bg-amber-700 px-6 py-4 text-white flex justify-between items-center">
                <h2 class="text-base font-bold">✏️ পুরাতন বকেয়া এডিট ({{ old_arrear.taxpayer.name }})</h2>
                <a href="{% url 'old_arrear_list' %}" class="text-xs bg-amber-800 px-3 py-1.5 rounded-lg text-white no-underline">← তালিকায় ফিরুন</a>
            </div>

            <form method="POST" class="p-6 space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">করদাতার নাম ও TIN</label>
                    <input type="text" value="{{ old_arrear.taxpayer.name }} (TIN: {{ old_arrear.taxpayer.tin }})" class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 bg-slate-100 font-bold text-slate-700" disabled>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">করবর্ষ <span class="text-rose-500">*</span></label>
                        <input type="text" name="assessment_year" value="{{ old_arrear.assessment_year }}" class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">বকেয়ার ধরন</label>
                        <select name="arrear_type" class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            <option value="UNDISPUTED" {% if old_arrear.arrear_type == 'UNDISPUTED' %}selected{% endif %}>অবিসংবাদিত (Undisputed)</option>
                            <option value="DISPUTED" {% if old_arrear.arrear_type == 'DISPUTED' %}selected{% endif %}>বিসংবাদিত (Disputed)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">মূল দাবি (Demand)</label>
                        <input type="number" step="0.01" name="demand" value="{{ old_arrear.demand }}" class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">জরিমানা/সুদ (Fine)</label>
                        <input type="number" step="0.01" name="fine" value="{{ old_arrear.fine }}" class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">পূর্বের আদায় (Collection)</label>
                        <input type="number" step="0.01" name="collection" value="{{ old_arrear.collection }}" class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>
                <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
                    <a href="{% url 'old_arrear_list' %}" class="px-4 py-2 text-xs border rounded-lg bg-slate-100 text-slate-700 font-semibold">বাতিল</a>
                    <button type="submit" class="px-6 py-2 text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 rounded-lg shadow-sm transition">আপডেট করুন</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
