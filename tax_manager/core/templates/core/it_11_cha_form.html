<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আই.টি-১১ছ (২০২৩) প্রত্যয়ন পত্র তৈরি</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Noto Sans Bengali Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Noto Sans Bengali', sans-serif;
            color: #1e293b;
        }

        .form-card {
            max-width: 850px;
            margin: 30px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            overflow: hidden;
        }

        .card-header-custom {
            background-color: #047857;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header-custom h5 {
            margin: 0;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .btn-dashboard {
            background-color: #065f46;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 0.875rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-dashboard:hover {
            background-color: #044e38;
            color: #ffffff;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 9px 13px;
            font-size: 0.95rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: #047857;
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.15);
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 6px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-submit {
            background-color: #047857;
            color: #ffffff;
            border: none;
            font-weight: 700;
            padding: 9px 24px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #065f46;
        }

        .required-star {
            color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="card form-card">
        <!-- কার্ড হেডার -->
        <div class="card-header-custom">
            <h5>📜 আই.টি-১১ছ (২০২৩) প্রত্যয়ন পত্র তৈরি</h5>
            <a href="javascript:history.back()" class="btn-dashboard">← ড্যাশবোর্ড</a>
        </div>

        <!-- কার্ড বডি / ফর্ম -->
        <div class="card-body p-4 p-md-5">
            <form method="POST" action="">
                {% csrf_token %}

                <!-- ১. করদাতার টিআইএন (TIN) -->
                <div class="mb-4">
                    <label class="form-label">করদাতার টিআইএন (TIN) <span class="required-star">*</span></label>
                    <input type="text" name="tin" class="form-control" placeholder="যেমন: 361067878511" required maxlength="12">
                </div>

                <!-- ২. করদাতার নাম ও সার্কেল (ম্যানুয়াল ইনপুট) -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">করদাতার নাম <span class="required-star">*</span></label>
                        <input type="text" name="taxpayer_name" class="form-control" placeholder="যেমন: Abu Kowcher" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">সার্কেল <span class="required-star">*</span></label>
                        <input type="text" name="circle" class="form-control" placeholder="যেমন: ১৩ (ফেনী সদর)" required>
                    </div>
                </div>

                <!-- ৩. করবর্ষ ও রিটার্ন দাখিলের তারিখ -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">করবর্ষ (Assessment Year) <span class="required-star">*</span></label>
                        <input type="text" name="assessment_year" class="form-control" value="2023-2024" placeholder="যেমন: 2023-2024" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">রিটার্ন দাখিলের তারিখ <span class="required-star">*</span></label>
                        <input type="date" name="submission_date" class="form-control" required>
                    </div>
                </div>

                <!-- ৪. মোট আয় ও মোট পরিশোধিত কর -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">মোট আয় (টাকা)</label>
                        <input type="number" name="total_income" class="form-control" placeholder="যেমন: 400000">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">মোট পরিশোধিত কর (টাকা)</label>
                        <input type="number" name="total_tax_paid" class="form-control" placeholder="যেমন: 20000">
                    </div>
                </div>

                <!-- ৫. রিটার্ন রেজিস্টারের ক্রমিক ও ভল্যুম নম্বর -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">রিটার্ন রেজিস্টারের ক্রমিক নম্বর</label>
                        <input type="text" name="serial_no" class="form-control" placeholder="যেমন: ২৯৫">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">রিটার্ন রেজিস্টারের ভল্যুম নম্বর</label>
                        <input type="text" name="volume_no" class="form-control" placeholder="যেমন: A">
                    </div>
                </div>

                <!-- অ্যাকশন বাটনসমূহ -->
                <div class="d-flex justify-content-end gap-2 border-top pt-4 mt-2">
                    <a href="javascript:history.back()" class="btn-cancel">বাতিল</a>
                    <button type="submit" class="btn-submit">সার্টিফিকেট প্রিভিউ ও প্রিন্ট</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
